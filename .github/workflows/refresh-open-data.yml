name: Actualizar datos de Open Data

on:
  schedule:
    # GitHub programa en UTC: estas dos horas cubren 20:15 tanto en CET como en CEST.
    - cron: "15 18,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar Open Data Madrid
        run: node scripts/refresh-data.mjs
      - name: Publicar la copia diaria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.js
          if [ -f matches.json ]; then git rm matches.json; fi
          if git diff --cached --quiet; then
            echo "La copia ya estaba actualizada."
            exit 0
          fi
          git commit -m "Actualiza calendario municipal desde Open Data"
          git push
